# Musher CLI Taskfile
# Usage: task [task-name]
# List tasks: task --list

version: '3'

vars:
  BINARY: musher
  MODULE: github.com/musher-dev/musher-cli
  GO_VERSION: 1.26.5
  GOLANGCI_LINT_VERSION: v2.11.3
  GOVULNCHECK_VERSION: v1.1.4
  NILAWAY_VERSION: v0.0.0-20260318203545-ad240b12fb4c
  SHFMT_VERSION: v3.13.0
  ACTIONLINT_VERSION: v1.7.11
  LEFTHOOK_VERSION: v2.1.5
  GIT_COMMIT:
    sh: git rev-parse --short HEAD
  GIT_DATE:
    sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
  LDFLAGS: >-
    -s -w
    -X main.version=dev
    -X main.commit={{.GIT_COMMIT}}
    -X main.date={{.GIT_DATE}}

tasks:
  # ===========================================================================
  # Setup
  # ===========================================================================

  setup:
    desc: Install dependencies and tools
    cmds:
      - go mod download
      - task: setup:tools
      - task: setup:hooks

  setup:tools:
    desc: Install required tooling
    cmds:
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install mvdan.cc/sh/v3/cmd/shfmt@{{.SHFMT_VERSION}}
      - go install github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
      - go install github.com/evilmartians/lefthook/v2@{{.LEFTHOOK_VERSION}}
      - go install go.uber.org/nilaway/cmd/nilaway@{{.NILAWAY_VERSION}}

  setup:hooks:
    desc: Install repository git hooks
    preconditions:
      - sh: command -v lefthook >/dev/null 2>&1
        msg: "lefthook is required. Run 'task setup:tools' first."
    cmds:
      - git config --unset core.hooksPath || true
      - lefthook install

  # ===========================================================================
  # Development
  # ===========================================================================

  build:
    desc: Build the musher binary
    cmds:
      - go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}} ./cmd/musher

  build:all:
    desc: Build for all platforms
    cmds:
      - GOOS=darwin GOARCH=amd64 go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}}-darwin-amd64 ./cmd/musher
      - GOOS=darwin GOARCH=arm64 go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}}-darwin-arm64 ./cmd/musher
      - GOOS=linux GOARCH=amd64 go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}}-linux-amd64 ./cmd/musher
      - GOOS=linux GOARCH=arm64 go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}}-linux-arm64 ./cmd/musher
      - GOOS=windows GOARCH=amd64 go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}}-windows-amd64.exe ./cmd/musher
      - GOOS=windows GOARCH=arm64 go build -ldflags '{{.LDFLAGS}}' -o {{.BINARY}}-windows-arm64.exe ./cmd/musher

  dev:install:
    desc: Build with version metadata and install to GOBIN
    cmds:
      - go install -ldflags '{{.LDFLAGS}}' ./cmd/musher

  run:
    desc: Run musher with arguments
    cmds:
      - go run ./cmd/musher {{.CLI_ARGS}}

  # ===========================================================================
  # Code Quality
  # ===========================================================================

  check:
    desc: Run the full local quality suite
    cmds:
      - task: check:ci

  check:ci:
    desc: Run the canonical CI quality gate
    cmds:
      - task: check:ci:lint
      - task: check:ci:test
      - task: check:ci:build
      - task: check:nilaway

  check:ci:lint:
    desc: CI lint group (format, style, policy)
    cmds:
      - task: check:fmt
      - task: check:shell
      - task: check:workflow
      - task: check:mod
      - task: check:policy
      - task: check:lint

  check:ci:test:
    desc: CI test group (tests, coverage, vulnerabilities)
    cmds:
      - task: check:vuln
      - task: check:test-cover
      - task: check:coverage:floor

  check:ci:build:
    desc: CI build verification group (compile, contracts, install)
    cmds:
      - task: check:compile
      - task: check:contracts
      - task: check:script
      - task: check:docs-snippets
      - task: check:install

  check:repo-policy:
    desc: Enforce repository policy guardrails
    cmds:
      - |
        fail=0
        # No floating @latest versions in automation
        if rg -n '(@latest|version:\s*latest)' .devcontainer/scripts .github/workflows 2>/dev/null; then
          echo "POLICY: floating @latest versions are not allowed; pin explicitly"
          fail=1
        fi
        # TODO/FIXME/HACK must reference an issue number
        if rg -n 'TODO|FIXME|HACK' --glob '*.go' | grep -v '#[0-9]' | grep -v 'context\.TODO' >/dev/null 2>&1; then
          echo "POLICY: TODO/FIXME/HACK comments must reference an issue number (#NNN)"
          rg -n 'TODO|FIXME|HACK' --glob '*.go' | grep -v '#[0-9]' | grep -v 'context\.TODO'
          fail=1
        fi
        # go.mod Go version must match Taskfile GO_VERSION
        mod_version=$(head -5 go.mod | grep '^go ' | awk '{print $2}')
        if [ "$mod_version" != "{{.GO_VERSION}}" ]; then
          echo "POLICY: go.mod says $mod_version but Taskfile expects {{.GO_VERSION}}"
          fail=1
        fi
        exit $fail

  check:fmt:
    desc: Check Go formatting and imports
    preconditions:
      - sh: command -v golangci-lint >/dev/null 2>&1
        msg: "golangci-lint is required. Run 'task setup:tools' first."
    cmds:
      - golangci-lint fmt --diff ./...

  check:fmt:files:
    desc: Check formatting on specific Go files
    preconditions:
      - sh: command -v golangci-lint >/dev/null 2>&1
        msg: "golangci-lint is required. Run 'task setup:tools' first."
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Pass one or more Go files after '--'."
    cmds:
      - golangci-lint fmt --diff {{.CLI_ARGS}}

  check:mod:
    desc: Verify module files are tidy
    cmds:
      - go mod tidy -diff

  check:lint:
    desc: Run golangci-lint v2 (strict)
    preconditions:
      - sh: command -v golangci-lint >/dev/null 2>&1
        msg: "golangci-lint is required. Run 'task setup:tools' first."
    cmds:
      - golangci-lint run ./...

  check:lint:files:
    desc: Run golangci-lint on packages containing the given Go files
    preconditions:
      - sh: command -v golangci-lint >/dev/null 2>&1
        msg: "golangci-lint is required. Run 'task setup:tools' first."
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Pass one or more Go files after '--'."
    cmds:
      - |
        dirs=$(for f in {{.CLI_ARGS}}; do dirname "$f"; done | sort -u)
        pkgs=""
        for d in $dirs; do
          pkgs="$pkgs ./$d"
        done
        golangci-lint run $pkgs

  check:shell:
    desc: Lint shell scripts with shfmt + shellcheck
    preconditions:
      - sh: command -v shfmt >/dev/null 2>&1
        msg: "shfmt is required. Run 'task setup:tools' first."
      - sh: command -v shellcheck >/dev/null 2>&1
        msg: "shellcheck is required and must be installed on PATH."
    cmds:
      - sh -c "find . -type f -name '*.sh' -print0 | xargs -0 shfmt -d -i 2 -ci -sr"
      - sh -c "find . -type f -name '*.sh' -print0 | xargs -0 shellcheck -x"

  check:shell:files:
    desc: Lint specific shell files
    preconditions:
      - sh: command -v shfmt >/dev/null 2>&1
        msg: "shfmt is required. Run 'task setup:tools' first."
      - sh: command -v shellcheck >/dev/null 2>&1
        msg: "shellcheck is required and must be installed on PATH."
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Pass one or more shell files after '--'."
    cmds:
      - shfmt -d -i 2 -ci -sr {{.CLI_ARGS}}
      - shellcheck -x {{.CLI_ARGS}}

  check:workflow:
    desc: Lint GitHub Actions workflows
    preconditions:
      - sh: command -v actionlint >/dev/null 2>&1
        msg: "actionlint is required. Run 'task setup:tools' first."
    cmds:
      - sh -c "find .github/workflows -type f \\( -name '*.yml' -o -name '*.yaml' \\) -print0 | xargs -0 actionlint"

  check:workflow:files:
    desc: Lint specific workflow files
    preconditions:
      - sh: command -v actionlint >/dev/null 2>&1
        msg: "actionlint is required. Run 'task setup:tools' first."
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Pass one or more workflow files after '--'."
    cmds:
      - actionlint {{.CLI_ARGS}}

  check:policy:
    desc: Run repository policy and architecture guardrails
    cmds:
      - task: check:repo-policy
      - GOCACHE="$(pwd)/.gocache" GOTMPDIR=/tmp go test ./internal/policy

  check:vuln:
    desc: Run govulncheck
    preconditions:
      - sh: command -v govulncheck >/dev/null 2>&1
        msg: "govulncheck is required. Run 'task setup:tools' first."
    cmds:
      - govulncheck ./...

  check:nilaway:
    desc: Run NilAway nil-safety analysis (advisory — does not block CI)
    preconditions:
      - sh: command -v nilaway >/dev/null 2>&1
        msg: "nilaway is required. Run 'task setup:tools' first."
    cmds:
      - |
        echo "Running NilAway nil-safety analysis..."
        if ! timeout 600 nilaway -include-pkgs="{{.MODULE}}" -exclude-test-files ./... 2>&1; then
          echo ""
          echo "NilAway reported findings above. Review for genuine nil risks."
          echo "Note: some findings may be false positives from cross-package analysis."
        fi

  check:coverage:floor:
    desc: Enforce minimum test coverage
    preconditions:
      - sh: test -f coverage.out
        msg: "coverage.out not found. Run 'task check:test-cover' first."
      - sh: test -n "${COVERAGE_THRESHOLD:-}"
        msg: "COVERAGE_THRESHOLD is required."
    cmds:
      - |
        total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
        threshold=${COVERAGE_THRESHOLD}
        if awk "BEGIN{exit (!($total < $threshold))}"; then
          echo "FAIL: total coverage ${total}% is below ${threshold}% floor" >&2
          exit 1
        fi
        echo "OK: total coverage ${total}% meets ${threshold}% floor"

  check:contracts:
    desc: Verify CLI command tree is stable
    vars:
      CONTRACTS_BIN: '{{.BINARY}}-contracts-check'
    cmds:
      - go build -o {{.CONTRACTS_BIN}} ./cmd/musher
      # Commands that must exist.
      - ./{{.CONTRACTS_BIN}} --help > /dev/null
      - ./{{.CONTRACTS_BIN}} auth --help > /dev/null
      - ./{{.CONTRACTS_BIN}} config --help > /dev/null
      - ./{{.CONTRACTS_BIN}} doctor > /dev/null 2>&1 || true
      - ./{{.CONTRACTS_BIN}} version > /dev/null
      # Commands that must NOT come back. The bundle registry was removed from
      # the platform (ADR 0062); reintroducing these would ship dead endpoints.
      #
      # Invoked WITHOUT --help on purpose: cobra services --help before it
      # validates the command name, so `musher bundle --help` exits 0 even when
      # no such command exists. Bare `musher bundle` is what actually reports
      # the unknown command.
      - |
        for removed in bundle hub cache search load run history; do
          if ./{{.CONTRACTS_BIN}} "$removed" > /dev/null 2>&1; then
            echo "FAIL: removed command '$removed' is routable again"
            exit 1
          fi
        done
      - rm -f ./{{.CONTRACTS_BIN}}

  check:install:
    desc: Validate install scripts and run installer integration tests
    cmds:
      - |
        if [ -f install.sh ]; then
          shellcheck -x install.sh
          sh -n install.sh
        fi
        if [ -f install.ps1 ]; then
          echo "install.ps1 exists"
        fi
      - go test -v ./test/install/...

  check:script:
    desc: Run real-binary CLI script tests
    cmds:
      - go test -v ./test/script/...

  check:docs-snippets:
    desc: Validate CLI examples from documentation still work
    cmds:
      - go test -v ./test/script/ -run '^TestDocs$'

  check:canary:
    desc: Run live golden-path canary checks (requires canary env vars)
    cmds:
      - go test -v ./test/canary/...

  check:test:
    desc: Run tests with race detection
    cmds:
      - go test -v -race ./...

  check:test-cover:
    desc: Run tests with coverage
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  check:compile:
    desc: Verify cross-platform compilation for all release targets
    cmds:
      - GOOS=darwin  GOARCH=amd64 go build ./cmd/musher
      - GOOS=darwin  GOARCH=arm64 go build ./cmd/musher
      - GOOS=linux   GOARCH=amd64 go build ./cmd/musher
      - GOOS=linux   GOARCH=arm64 go build ./cmd/musher
      - GOOS=windows GOARCH=amd64 go build ./cmd/musher
      - GOOS=windows GOARCH=arm64 go build ./cmd/musher

  check:pre-push:
    desc: Run the pre-push verification suite
    deps:
      - check:policy
      - check:lint
      - check:test

  check:release:
    desc: Validate the checked-in GoReleaser configuration
    preconditions:
      - sh: command -v goreleaser >/dev/null 2>&1
        msg: "goreleaser is required to run release config checks."
    cmds:
      - goreleaser check

  dev:test-live:
    desc: Run integration tests against live api.musher.dev (requires MUSHER_API_KEY)
    preconditions:
      - sh: test -n "$MUSHER_API_KEY"
        msg: "MUSHER_API_KEY must be set. Export your API key and retry."
    cmds:
      - go test -v -race -tags integration ./...

  # Quick aliases
  test:
    desc: Run tests (alias for check:test)
    cmds:
      - task: check:test

  lint:
    desc: Run linter (alias for check:lint)
    cmds:
      - task: check:lint

  # ===========================================================================
  # Formatting
  # ===========================================================================

  fmt:
    desc: Format Go code and imports
    preconditions:
      - sh: command -v golangci-lint >/dev/null 2>&1
        msg: "golangci-lint is required. Run 'task setup:tools' first."
      - sh: command -v shfmt >/dev/null 2>&1
        msg: "shfmt is required. Run 'task setup:tools' first."
    cmds:
      - golangci-lint fmt ./...
      - sh -c "find . -type f -name '*.sh' -print0 | xargs -0 shfmt -w -i 2 -ci -sr"
      - go mod tidy

  # ===========================================================================
  # Git Hooks
  # ===========================================================================

  hooks:install:
    desc: Install repository git hooks via Lefthook
    preconditions:
      - sh: command -v lefthook >/dev/null 2>&1
        msg: "lefthook is required. Run 'task setup:tools' first."
    cmds:
      - git config --unset core.hooksPath || true
      - lefthook install
      - task: hooks:doctor

  hooks:doctor:config:
    desc: Verify hook config prerequisites
    cmds:
      - test -f lefthook.yml || (echo "lefthook.yml not found" && exit 1)
      - command -v lefthook >/dev/null 2>&1 || (echo "lefthook is required" && exit 1)
      - command -v task >/dev/null 2>&1 || (echo "task is required" && exit 1)
      - command -v git >/dev/null 2>&1 || (echo "git is required" && exit 1)

  hooks:doctor:
    desc: Verify Lefthook installation in .git/hooks
    cmds:
      - task: hooks:doctor:config
      - test -z "$(git config --get core.hooksPath || true)" || (echo "core.hooksPath must be unset for Lefthook-managed hooks" && exit 1)
      - test -x .git/hooks/pre-commit || (echo "missing executable .git/hooks/pre-commit" && exit 1)
      - test -x .git/hooks/commit-msg || (echo "missing executable .git/hooks/commit-msg" && exit 1)
      - test -x .git/hooks/pre-push || (echo "missing executable .git/hooks/pre-push" && exit 1)

  hooks:pre-commit:go:
    desc: Run staged Go formatting and lint checks
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Pass one or more staged Go files after '--'."
    cmds:
      - task check:fmt:files -- {{.CLI_ARGS}}
      - |
        bash -lc '
          set -euo pipefail
          declare -A package_set=()

          for file in "$@"; do
            dir="$(dirname "$file")"
            if [[ "$dir" == "." ]]; then
              package_set["./"]=1
            else
              package_set["./$dir/..."]=1
            fi
          done

          packages=()
          for pkg in "${!package_set[@]}"; do
            packages+=("$pkg")
          done

          if [[ ${#packages[@]} -gt 0 ]]; then
            task check:lint:files -- "${packages[@]}"
          fi
        ' _ {{.CLI_ARGS}}

  hooks:pre-push:
    desc: Run the canonical pre-push verification suite
    cmds:
      - task: check:pre-push

  # ===========================================================================
  # Utilities
  # ===========================================================================

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY}} {{.BINARY}}-*
      - rm -f coverage.out coverage.html

  version:
    desc: Show version info
    cmds:
      - go run ./cmd/musher version

  help:
    desc: Show musher help
    cmds:
      - go run ./cmd/musher --help
