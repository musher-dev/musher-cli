name: Golden Path Canary

on:
  workflow_dispatch:
  schedule:
    # Hourly, not every 30 minutes: each run performs real API calls against the
    # live platform, and a tighter cadence buys no signal for the quota.
    - cron: "0 * * * *"

permissions:
  contents: read
  issues: write

# Overlapping runs would race on the same canary resources.
concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    name: Synthetic Golden Path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run canary tests
        env:
          MUSHER_CANARY_API_URL: ${{ secrets.MUSHER_CANARY_API_URL }}
          MUSHER_CANARY_API_KEY: ${{ secrets.MUSHER_CANARY_API_KEY }}
          MUSHER_CANARY_PUBLIC_BUNDLE_REF: ${{ secrets.MUSHER_CANARY_PUBLIC_BUNDLE_REF }}
          MUSHER_CANARY_EXPECTED_NAMESPACE: ${{ secrets.MUSHER_CANARY_EXPECTED_NAMESPACE }}
          MUSHER_CANARY_PUSH_NAMESPACE: ${{ secrets.MUSHER_CANARY_PUSH_NAMESPACE }}
          MUSHER_CANARY_PUSH_SLUG: ${{ secrets.MUSHER_CANARY_PUSH_SLUG }}
          MUSHER_NETWORK_CA_CERT_FILE: ${{ secrets.MUSHER_CANARY_CA_CERT_FILE }}
          # Makes the Go test t.Fatal instead of t.Skip when secrets are absent,
          # so the shell guard below and the test's own guard cannot drift apart.
          MUSHER_CANARY_REQUIRED: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          if [ -z "${MUSHER_CANARY_API_URL:-}" ] || [ -z "${MUSHER_CANARY_API_KEY:-}" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::Canary secrets are not configured. A monitor that cannot run is an outage of the monitor."
              exit 1
            fi
            echo "Canary secrets not configured; skipping (manual dispatch)."
            exit 0
          fi
          go test -v ./test/canary/...

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A sustained outage fires this job every hour. Comment on the open
          # issue instead of opening a new one each time.
          existing=$(gh issue list --label canary --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "Still failing as of $(date -u +%Y-%m-%dT%H:%M:%SZ). [View run](${RUN_URL})."
          else
            gh issue create \
              --title "Canary failure: golden path failing ($(date -u +%Y-%m-%d))" \
              --body "The scheduled canary workflow failed. [View run](${RUN_URL})." \
              --label "bug,canary"
          fi
