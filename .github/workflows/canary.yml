name: Golden Path Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Synthetic Golden Path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run canary tests
        env:
          MUSHER_CANARY_API_URL: ${{ secrets.MUSHER_CANARY_API_URL }}
          MUSHER_CANARY_API_KEY: ${{ secrets.MUSHER_CANARY_API_KEY }}
          MUSHER_CANARY_PUBLIC_BUNDLE_REF: ${{ secrets.MUSHER_CANARY_PUBLIC_BUNDLE_REF }}
          MUSHER_CANARY_EXPECTED_NAMESPACE: ${{ secrets.MUSHER_CANARY_EXPECTED_NAMESPACE }}
          MUSHER_CANARY_PUSH_NAMESPACE: ${{ secrets.MUSHER_CANARY_PUSH_NAMESPACE }}
          MUSHER_CANARY_PUSH_SLUG: ${{ secrets.MUSHER_CANARY_PUSH_SLUG }}
          MUSHER_NETWORK_CA_CERT_FILE: ${{ secrets.MUSHER_CANARY_CA_CERT_FILE }}
        run: |
          if [ -z "${MUSHER_CANARY_API_URL:-}" ] || [ -z "${MUSHER_CANARY_API_KEY:-}" ] || [ -z "${MUSHER_CANARY_PUBLIC_BUNDLE_REF:-}" ] || [ -z "${MUSHER_CANARY_EXPECTED_NAMESPACE:-}" ]; then
            echo "Canary secrets not configured; skipping."
            exit 0
          fi
          go test -v ./test/canary/...

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Canary failure: golden path tests failing ($(date -u +%Y-%m-%d))" \
            --body "The scheduled canary workflow failed. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --label "bug,canary"
