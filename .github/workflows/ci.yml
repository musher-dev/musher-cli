name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Raised from 69.5 alongside the deployment-CLI amputation. Removing the bundle
  # stack and the bundle-specific TUI screens took the measured number from 67.2%
  # to 78.8% as arithmetic rather than as progress. Holding the old floor would
  # have silently permitted several hundred statements of untested transport code
  # in the phases that follow.
  COVERAGE_THRESHOLD: "78"

jobs:
  # ---------------------------------------------------------------------------
  # Lint — formatting, style, policy, static analysis
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --help
          install-mode: binary

      - name: Install tools
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

      - name: Run lint suite
        run: task check:ci:lint

  # ---------------------------------------------------------------------------
  # Test — unit tests, coverage, vulnerability scan
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run tests with coverage
        run: task check:ci:test

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

      - name: Upload to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build — cross-compilation, CLI contracts, install scripts, GoReleaser
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run build verification
        run: task check:ci:build

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # ---------------------------------------------------------------------------
  # NilAway — nil-safety analysis (advisory, does not block other jobs)
  # ---------------------------------------------------------------------------
  nilaway:
    name: NilAway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install NilAway
        run: go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260318203545-ad240b12fb4c

      - name: Run NilAway analysis
        run: task check:nilaway

  # ---------------------------------------------------------------------------
  # Smoke — platform-specific tests (macOS, Windows)
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke (${{ matrix.os }})
    needs: [lint, test, build]
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o musher${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/musher

      - name: Version smoke test
        run: go run ./cmd/musher version

      - name: Help smoke test
        run: go run ./cmd/musher --help

      - name: Run policy tests
        run: go test ./internal/policy

      - name: Run tests
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  # Dev Container — built and started only when the change touches it
  # ---------------------------------------------------------------------------
  # Decides whether this change touches what the dev container is built from.
  # The dev container job is the slowest here and proves only those files, so
  # it runs when one of them changed and is skipped otherwise.
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      devcontainer: ${{ steps.scope.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The base commit must be in the clone to diff against.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the dev container needs testing
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          # What the change builds on: the pull request's base, or the
          # previous tip of main on a push.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Its inputs: .devcontainer/ (devcontainer.json, the Features
          # lockfile, .env.example, the compose stack and its config, the
          # lifecycle scripts) and this workflow, which holds the job.
          inputs='^(\.devcontainer/|\.github/workflows/ci\.yml$)'
          decide() {
            echo "devcontainer=$1" >> "$GITHUB_OUTPUT"
            echo "devcontainer=$1: $2"
          }
          case "$EVENT" in
            pull_request | push) ;;
            *)
              decide true "a ${EVENT} run tests it"
              exit 0
              ;;
          esac
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2> /dev/null; then
            decide true "no base commit to diff against"
            exit 0
          fi
          # Three dots: what the change made since it left its base, not
          # what landed on the base since.
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          if grep -qE "$inputs" <<< "$changed"; then
            decide true "a dev container input changed"
          else
            decide false "no dev container input changed"
          fi

  devcontainer:
    name: Dev Container
    needs: detect
    if: needs.detect.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # --frozen-lockfile fails when devcontainer-lock.json is missing or no
      # longer matches devcontainer.json.
      - name: Build the dev container
        run: npx -y @devcontainers/cli@0.89.0 build --workspace-folder . --frozen-lockfile

      # Runs every lifecycle script: post-create ends with base_verify_tools
      # and `task setup`, and startup brings up the compose services and fails
      # on one that exits or turns unhealthy.
      - name: Start it and run its lifecycle
        run: npx -y @devcontainers/cli@0.89.0 up --workspace-folder .
