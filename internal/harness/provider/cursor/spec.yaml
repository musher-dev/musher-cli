name: cursor
displayName: Cursor
description: AI-powered code editor agent
binary: agent

directories:
  project: ".cursor"
  user: "~/.cursor"

bundleDir:
  mode: cwd

assets:
  skillDir: ".cursor/rules"
  agentDir: ".cursor/agents"
  toolConfigFile: ".cursor/mcp.json"

mcp:
  format: json
  configPath: ".cursor/mcp.json"

status:
  versionArgs: ["--version"]
  installHint: "Install Cursor CLI: curl https://cursor.com/install -fsS | bash"
  installCommand: ["bash", "-c", "curl https://cursor.com/install -fsS | bash"]
