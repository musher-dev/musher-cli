name: opencode
displayName: OpenCode
description: Open-source AI coding agent
binary: opencode

directories:
  project: ".opencode"
  user: "~/.config/opencode"

bundleDir:
  mode: add_dir
  envVar: "OPENCODE_CONFIG_DIR"

assets:
  skillDir: "skills"
  agentDir: "agents"
  toolConfigFile: "opencode.json"

mcp:
  format: json
  configPath: "opencode.json"

status:
  versionArgs: ["--version"]
  installHint: "Install OpenCode: curl -fsSL https://opencode.ai/install | bash"
  installCommand: ["bash", "-c", "curl -fsSL https://opencode.ai/install | bash"]
  authCheck:
    path: "~/.local/share/opencode/auth.json"
    description: OpenCode authentication
