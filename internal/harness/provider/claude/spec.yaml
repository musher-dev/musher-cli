name: claude
displayName: Claude Code
description: Anthropic's agentic coding tool
binary: claude

directories:
  project: ".claude"
  user: "~/.claude"

bundleDir:
  mode: add_dir
  flag: "--add-dir"

assets:
  skillDir: ".claude/skills"
  agentDir: ".claude/agents"
  toolConfigFile: ".mcp.json"

mcp:
  format: json
  configPath: ".mcp.json"

cli:
  mcpConfigFlag: "--mcp-config"
  agentsFlag: "--agents"

status:
  versionArgs: ["--version"]
  installHint: "Install Claude Code: curl -fsSL https://claude.ai/install.sh | bash"
  installCommand: ["bash", "-c", "curl -fsSL https://claude.ai/install.sh | bash"]
  authCheck:
    path: "~/.claude/.credentials.json"
    description: Claude Code credentials
