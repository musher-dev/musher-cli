name: copilot
displayName: GitHub Copilot
description: GitHub's AI coding agent
binary: copilot

directories:
  project: ".github"
  user: "~/.copilot"

bundleDir:
  mode: add_dir
  flag: "--add-dir"

assets:
  skillDir: ".github/skills"
  agentDir: ".github/agents"
  toolConfigFile: "~/.copilot/mcp-config.json"

mcp:
  format: json
  configPath: "~/.copilot/mcp-config.json"

cli:
  mcpConfigFlag: "--additional-mcp-config"

status:
  versionArgs: ["--version"]
  installHint: "Install GitHub Copilot: npm install -g @github/copilot"
  installCommand: ["npm", "install", "-g", "@github/copilot"]
  authCheck:
    path: "~/.copilot/oauth_token"
    description: GitHub Copilot OAuth token
