# golangci-lint v2 configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  relative-path-mode: gomod
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  enable-build-vcs: true
  allow-parallel-runners: true
  allow-serial-runners: true

linters:
  default: none
  enable:
    - govet           # Official Go vet
    - errcheck        # Ensure errors are handled
    - staticcheck     # Advanced static analysis (includes gosimple)
    - unused          # Unused code detection
    - ineffassign     # Unused assignments
    - bidichk         # Detect dangerous bidirectional text
    - revive          # Style linter (golint replacement)
    - bodyclose       # HTTP response body closure
    - noctx           # HTTP requests with context
    - gocritic        # Additional checks
    - fatcontext      # Nested contexts in loops/closures
    - depguard        # Import boundary enforcement
    - forbidigo       # Enforce output abstraction usage
    - gosec           # Security vulnerability detection
    - dupl            # Duplicate code detection
    - errorlint       # Error wrapping correctness (Go 1.13+)
    - misspell        # Spelling errors in comments/strings
    - nilnil          # Avoid returning nil, nil
    - nilnesserr      # Nilness-related error issues
    - usetesting      # Ensure test helpers use testing package APIs
    - thelper         # Ensure test helpers call t.Helper
    - tparallel       # Catch missing t.Parallel in table tests
    - unconvert       # Unnecessary type conversions
    - nilerr          # Nil error return detection
    - varnamelen      # Variable name length by scope
    - nolintlint      # Ensure nolint directives are strict
    - wrapcheck       # Ensure external errors are wrapped
    - copyloopvar     # Catch unsafe loop var captures
    - durationcheck   # Invalid duration math
    - errname         # Error naming conventions
    - predeclared     # Shadowing predeclared identifiers
    - usestdlibvars   # Prefer stdlib constants/vars
    - wastedassign    # Detect wasted assignments
    - godot           # Require period at end of comments
    - whitespace      # Remove unnecessary blank lines
    - intrange        # Go 1.22+ integer range suggestions
    - reassign        # Package-level variable reassignment detection
    - containedctx    # context.Context in structs
    - makezero        # Slice initialization correctness
    - mirror          # Prefer mirror stdlib functions
    - perfsprint      # Faster string formatting alternatives
    - sloglint        # Consistent slog usage
    - exhaustive      # Exhaustive switch/map on enums
    - goconst         # Repeated literals that should be constants
    - nakedret        # Naked returns in long functions
    - gocognit        # Cognitive complexity
    - wsl_v5          # Whitespace style linting
    - contextcheck    # Prefer inherited contexts
    - canonicalheader # Canonical HTTP header keys
    - modernize       # Modern Go simplifications
    - musttag         # Require serialization tags
    - loggercheck     # Structured logger argument correctness
    - spancheck       # OpenTelemetry span correctness
    - gocheckcompilerdirectives # Validate //go: directives
    - gomoddirectives # Keep go.mod directives disciplined
    - errchkjson      # Catch bad JSON encode/decode usage
    - asciicheck      # Ban non-ASCII identifiers
  settings:
    govet:
      enable:
        - shadow        # Variable shadowing detection
    copyloopvar:
      check-alias: true
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/fatih/color.Color).Fprint
        - (*github.com/fatih/color.Color).Fprintf
        - (*github.com/fatih/color.Color).Fprintln
        - (io.ReadCloser).Close
        - (io.Closer).Close
    revive:
      severity: error
      rules:
        - name: exported
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: range-val-in-closure
        - name: package-comments
        - name: comment-spacings
        - name: superfluous-else
        - name: time-naming
        - name: time-equal
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - opinionated
    depguard:
      rules:
        internal_no_cmd_import:
          files:
            - "**/internal/*.go"
            - "**/internal/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/cmd/musher
              desc: internal packages must not import cmd/musher
        platform_no_presentation:
          files:
            - "**/internal/client/*.go"
            - "**/internal/client/**/*.go"
            - "**/internal/auth/*.go"
            - "**/internal/auth/**/*.go"
            - "**/internal/config/*.go"
            - "**/internal/config/**/*.go"
            - "**/internal/update/*.go"
            - "**/internal/update/**/*.go"
            - "**/internal/errors/*.go"
            - "**/internal/errors/**/*.go"
            - "**/internal/buildinfo/*.go"
            - "**/internal/buildinfo/**/*.go"
            - "**/internal/terminal/*.go"
            - "**/internal/terminal/**/*.go"
            - "**/internal/paths/*.go"
            - "**/internal/paths/**/*.go"
            - "**/internal/observability/*.go"
            - "**/internal/observability/**/*.go"
            - "**/internal/workflow/*.go"
            - "**/internal/workflow/**/*.go"
            - "**/internal/deployspec/*.go"
            - "**/internal/deployspec/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/output
              desc: platform/core packages must not depend on output
            - pkg: github.com/musher-dev/musher-cli/internal/prompt
              desc: platform/core packages must not depend on prompt
        testutil_no_production:
          files:
            - "!**/*_test.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/testutil
              desc: testutil is for tests only and must not be imported by production code
        doctor_no_output:
          files:
            - "**/internal/doctor/*.go"
            - "**/internal/doctor/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/output
              desc: doctor package must remain output-agnostic
        client_isolation:
          files:
            - "**/internal/client/*.go"
            - "**/internal/client/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/deploy
              desc: client is transport only and must not import use-case packages
            - pkg: github.com/musher-dev/musher-cli/internal/workflow
              desc: client is transport only and must not import use-case packages
        stream_isolation:
          # depguard matches absolute paths, so scoped globs need a `**` prefix.
          files:
            - "**/internal/client/stream/*.go"
            - "**/internal/client/stream/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/output
              desc: the SSE stream client is transport only and must not depend on output
            - pkg: github.com/musher-dev/musher-cli/internal/prompt
              desc: the SSE stream client is transport only and must not depend on prompt
            - pkg: github.com/musher-dev/musher-cli/internal/workflow
              desc: the SSE stream client is transport only and must not import use-case packages
        cmd_no_net_http:
          files:
            - "**/cmd/musher/*.go"
            - "**/cmd/musher/**/*.go"
          deny:
            - pkg: net/http
              desc: cmd/ must use internal/client for HTTP, not net/http directly
        tui_isolation:
          files:
            - "**/internal/tui/*.go"
            - "**/internal/tui/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/output
              desc: TUI has own rendering via bubbletea
            - pkg: github.com/musher-dev/musher-cli/internal/prompt
              desc: TUI has own prompting via bubbletea
        output_no_tui:
          files:
            - "**/internal/output/*.go"
            - "**/internal/output/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/tui
              desc: output must not depend on the TUI layer
        prompt_no_tui:
          files:
            - "**/internal/prompt/*.go"
            - "**/internal/prompt/**/*.go"
          deny:
            - pkg: github.com/musher-dev/musher-cli/internal/tui
              desc: prompt must not depend on the TUI layer
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(ln)?$
          msg: "use output.Writer.Print() or Println() instead"
        - pattern: ^fmt\.Printf$
          msg: "use output.Writer.Print() instead"
        - pattern: ^fmt\.Errorf$
          msg: "use internal/errors.Errorf instead of fmt.Errorf"
        - pattern: ^log\.(Print|Fatal|Panic)(ln|f)?$
          msg: "use output.Writer instead of log package"
        - pattern: ^os\.Getenv$
          msg: "use internal/env (env.Get) instead of os.Getenv"
        - pattern: ^os\.LookupEnv$
          msg: "use internal/env (env.Lookup) instead of os.LookupEnv"
    gosec:
      excludes:
        - G104
        - G115
        - G703
        - G704
      config:
        global:
          nosec: true
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    misspell:
      locale: "US"
    usetesting:
      os-create-temp: true
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true
      os-chdir: true
      context-background: true
      context-todo: true
    varnamelen:
      min-name-length: 3
      check-receiver: false
      check-return: false
      check-type-param: false
      ignore-names:
        - i
        - j
        - k
        - v
        - w
        - t
        - ok
        - id
        - ip
        - db
        - tx
        - wg
        - mu
        - tt
        - ch
        - fs
        - io
        - c
        - p
        - r
      ignore-decls:
        - c *cobra.Command
        - c *client.Client
        - p *prompt.Prompter
        - w http.ResponseWriter
        - r *http.Request
        - f *os.File
        - h slog.Handler
    nolintlint:
      require-explanation: true
      require-specific: true
    godot:
      scope: declarations
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 3
    nakedret:
      max-func-lines: 15
    gocognit:
      min-complexity: 20
    predeclared:
      qualified-name: true
    spancheck:
      checks:
        - end
        - record-error
        - set-status
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        linters:
          - varnamelen
      - path: _test\.go
        linters:
          - goconst
      - path: _test\.go
        linters:
          - gocognit
          - contextcheck
          - musttag
      - path: _test\.go
        linters:
          - forbidigo    # tests may use os.Getenv / fmt.Print freely
      - path: internal/env/env\.go
        linters:
          - forbidigo    # env wraps os.Getenv/LookupEnv (the single allowed site)

formatters:
  enable:
    - gofumpt         # Strict formatting
    - goimports       # Import management
  settings:
    gofumpt:
      extra-rules: true
